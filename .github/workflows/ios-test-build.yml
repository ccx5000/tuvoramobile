name: Build Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

  push:
    branches: [main]
    paths: ['.github/workflows/ios-test-build.yml']

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration || 'Release' }} IPA
    runs-on: macos-26
    timeout-minutes: ${{ (inputs.configuration || 'Release') == 'Release' && 360 || 60 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      KOTLIN_FRAMEWORK_OPTIMIZE: "false"
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        if: env.RELEASE_PROPERTIES_BASE64 != ''
        run: |
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties

      - name: Create default local.properties
        if: env.RELEASE_PROPERTIES_BASE64 == ''
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "TMDB_API_KEY="
            echo "TRAKT_CLIENT_ID="
            echo "TRAKT_CLIENT_SECRET="
            echo "SIMKL_CLIENT_ID="
            echo "SIMKL_CLIENT_SECRET="
            echo "MDBLIST_CLIENT_ID="
            echo "DONATIONS_DONATE_URL="
          } > local.properties

      - name: Tune Gradle memory for the runner
        run: |
          {
            echo ""
            echo "# CI override: release K/N global optimizations are off (KOTLIN_FRAMEWORK_OPTIMIZE)"
            echo "# so the link needs far less than the 10.6G peak the optimized pass measured."
            echo "org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:G1PeriodicGCInterval=120000 -XX:-G1PeriodicGCInvokesConcurrent"
            echo "kotlin.daemon.jvmargs=-Xmx2048M"
            echo "kotlin.native.jvmArgs=-Xmx6144M"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build MPVKit dist xcframeworks
        run: |
          cd MPVKit
          make build platform=ios

      - name: Re-extract vendored xcframeworks (make wipes the shared dir per library)
        run: |
          cd MPVKit/dist/release
          if [[ ! -f Libplacebo.xcframework.zip ]]; then
            echo "Libplacebo.xcframework.zip missing from make output - fetching the prebuilt release the pipeline already consumes"
            wget -q -O Libplacebo.xcframework.zip https://github.com/mpvkit/libplacebo-build/releases/download/7.360.1/Libplacebo.xcframework.zip
          fi
          for z in ./*.xcframework.zip; do
            name="$(basename "$z" .xcframework.zip)"
            xf="$name.xcframework"
            target="xcframework/$xf"
            work="xcframework/.unpack-$xf"
            lift="$target.lift"
            rm -rf "$target" "$work" "$lift"
            mkdir -p "$work"
            unzip -oq "$z" -d "$work"
            entry="$(find "$work" -type d -name "$xf" | sort | head -1)"
            if [[ -z "$entry" ]]; then
              entry="$(find "$work" -type d -name '*.xcframework' | sort | head -1)"
            fi
            if [[ -z "$entry" ]]; then
              if [[ -d "$work/ios-arm64" ]]; then
                entry="$work"
              else
                echo "No $xf inside $z - extracted tree:" >&2
                find "$work" -maxdepth 3 >&2
                exit 1
              fi
            fi
            mv "$entry" "$target"
            while [[ ! -f "$target/Info.plist" ]]; do
              inner="$(find "$target" -mindepth 1 -maxdepth 1 -type d -name '*.xcframework' | sort | head -1)"
              [[ -n "$inner" ]] || break
              rm -rf "$lift"
              mv "$inner" "$lift"
              rm -rf "$target"
              mv "$lift" "$target"
            done
            rm -rf "$work" "$lift"
            echo "$xf: $(find "$target" -mindepth 1 -maxdepth 1 -type d | xargs -n1 basename | tr '\n' ' ')"
          done
          for lib in Libmpv Libavcodec Libavdevice Libavfilter Libavformat Libavutil Libswresample Libswscale Libplacebo; do
            [[ -d "xcframework/$lib.xcframework" ]] || { echo "MISSING xcframework/$lib.xcframework" >&2; exit 1; }
          done
          if [[ ! -f xcframework/Libmpv.xcframework/ios-arm64/Libmpv.framework/Libmpv ]]; then
            echo "Libmpv device slice still wrong:" >&2
            find xcframework/Libmpv.xcframework -maxdepth 4 >&2
            exit 1
          fi

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration || 'Release' }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
