name: TV IPA (disabled)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tvos-build.yml']

permissions:
  contents: read

jobs:
  build:
    name: TV IPA disabled by request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: tvos-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: No-op
        run: echo "The Apple TV IPA build is no longer requested; skipping."
